<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>Snake Duel</title>

<style>

/* ============================================================
   RESET
   ============================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #111;
    color: #eee;

    font-family: Arial, sans-serif;

    overflow: hidden;

    touch-action: none;
}


/* ============================================================
   DESKTOP
   ============================================================ */

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    text-align: center;
}

h1 {
    margin: 0 0 10px;

    letter-spacing: 4px;
}


/* ============================================================
   TOP CONTROLS
   ============================================================ */

.controls {
    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 10px;

    margin-bottom: 12px;
}

button {
    background: #222;
    color: #eee;

    border: 1px solid #555;

    padding: 8px 16px;

    cursor: pointer;

    font-size: 14px;

    -webkit-tap-highlight-color: transparent;
}

button:hover {
    background: #333;
}


/* ============================================================
   SPEED
   ============================================================ */

.speed-control {
    display: flex;

    align-items: center;

    gap: 8px;

    background: #1a1a1a;

    border: 1px solid #333;

    padding: 6px 10px;
}

#speedSlider {
    width: 150px;
}

#speedValue {
    display: inline-block;

    width: 20px;

    font-weight: bold;
}


/* ============================================================
   SCORE
   ============================================================ */

.info {
    display: flex;

    justify-content: space-between;

    width: 800px;
    max-width: 95vw;

    margin: 10px auto;

    font-size: 18px;
}

.p1 {
    color: #42e878;
}

.p2 {
    color: #4da6ff;
}

.food {
    color: #ff5050;
}


/* ============================================================
   CANVAS
   ============================================================ */

.canvas-wrapper {
    display: flex;

    justify-content: center;
    align-items: center;
}

canvas {
    display: block;

    width: 800px;
    height: 600px;

    max-width: 95vw;
    max-height: 70vh;

    background: #080808;

    border: 2px solid #444;

    image-rendering: pixelated;
}


/* ============================================================
   MESSAGE
   ============================================================ */

#message {
    height: 30px;

    margin-top: 8px;

    font-size: 20px;

    font-weight: bold;
}


.help {
    color: #888;

    font-size: 13px;

    line-height: 1.6;

    margin-top: 10px;
}


/* ============================================================
   PHONE CONTROLS
   ============================================================ */

.phone-controls {
    display: none;

    position: fixed;

    z-index: 100;

    user-select: none;
}


/* ============================================================
   D-PAD
   ============================================================ */

.dpad {
    display: grid;

    grid-template-columns:
        64px 64px 64px;

    grid-template-rows:
        64px 64px 64px;

    gap: 5px;
}


.phone-btn {
    width: 64px;
    height: 64px;

    padding: 0;

    border-radius: 14px;

    border: 2px solid #555;

    background: rgba(40, 40, 40, 0.92);

    color: white;

    font-size: 30px;

    display: flex;

    justify-content: center;
    align-items: center;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;
}

.phone-btn:active {
    background: #555;

    transform: scale(0.92);
}


.dpad-up {
    grid-column: 2;
    grid-row: 1;
}

.dpad-left {
    grid-column: 1;
    grid-row: 2;
}

.dpad-down {
    grid-column: 2;
    grid-row: 3;
}

.dpad-right {
    grid-column: 3;
    grid-row: 2;
}


/* ============================================================
   PHONE — PORTRAIT
   ============================================================ */

body.phone {
    display: block;
}

body.phone .game {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
}


/* Убираем клавиатурную подсказку */

body.phone .help {
    display: none;
}


/* Заголовок */

body.phone h1 {
    font-size: 20px;

    margin: 3px 0;

    flex-shrink: 0;
}


/* Верхняя панель */

body.phone .controls {
    width: 100%;

    margin: 2px 0;

    gap: 5px;

    flex-shrink: 0;
}

body.phone .controls button {
    padding: 5px 9px;

    font-size: 11px;
}


/* Скорость */

body.phone .speed-control {
    padding: 3px 6px;

    font-size: 11px;
}

body.phone #speedSlider {
    width: 90px;
}


/* Счёт */

body.phone .info {
    width: 96%;

    margin: 3px auto;

    font-size: 14px;

    flex-shrink: 0;
}


/* ============================================================
   ИГРОВОЕ ПОЛЕ
   ============================================================ */

/*
    Резервируем снизу место под D-pad.

    Благодаря этому поле физически не может
    попасть под кнопки управления.
*/

body.phone .canvas-wrapper {
    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    /*
        Нижний padding = область управления.
        Поле автоматически поднимается вверх.
    */

    padding:

        0

        0

        210px

        0;
}


body.phone canvas {
    width: auto;
    height: auto;

    max-width: 96vw;

    /*
        Не даём canvas занимать область,
        зарезервированную под D-pad.
    */

    max-height: 100%;

    aspect-ratio: 4 / 3;
}


/* ============================================================
   СООБЩЕНИЕ
   ============================================================ */

body.phone #message {
    /*
        Сообщение находится непосредственно
        над областью управления.
    */

    position: fixed;

    left: 50%;

    bottom: 205px;

    transform: translateX(-50%);

    z-index: 20;

    width: 100%;

    height: 28px;

    margin: 0;

    font-size: 17px;

    text-align: center;

    white-space: nowrap;
}


/* ============================================================
   D-PAD
   ============================================================ */

body.phone .phone-controls {
    display: block;

    position: fixed;

    z-index: 100;

    left: 50%;

    /*
        D-pad находится в самом низу,
        но выше системной области навигации.
    */

    bottom: 8px;

    transform: translateX(-50%);
}


/* ============================================================
   D-PAD BUTTONS
   ============================================================ */

.phone-btn {
    width: 64px;
    height: 64px;

    padding: 0;

    border-radius: 14px;

    border: 2px solid #555;

    background: rgba(40, 40, 40, 0.95);

    color: white;

    font-size: 30px;

    display: flex;

    justify-content: center;
    align-items: center;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;
}

.phone-btn:active {
    background: #555;

    transform: scale(0.92);
}


/* ============================================================
   SMALL PHONES
   ============================================================ */

@media
(max-width: 400px)
and (orientation: portrait) {

    body.phone .controls button {
        padding: 4px 6px;

        font-size: 10px;
    }


    body.phone .speed-control {
        font-size: 10px;
    }


    body.phone #speedSlider {
        width: 70px;
    }


    body.phone .info {
        font-size: 12px;
    }


    /*
        На маленьком экране уменьшаем
        зарезервированную область.
    */

    body.phone .canvas-wrapper {
        padding-bottom: 185px;
    }


    body.phone #message {
        bottom: 180px;

        font-size: 15px;
    }


    .phone-btn {
        width: 58px;
        height: 58px;
    }


    .dpad {
        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            58px 58px 58px;
    }
}


/* ============================================================
   PHONE — LANDSCAPE
   ============================================================ */

@media
(max-width: 1000px)
and (orientation: landscape) {

    body.phone .game {
        width: 100vw;
        height: 100vh;

        display: block;

        position: relative;
    }


    body.phone h1 {
        display: none;
    }


    /*
        Панель сверху слева.
    */

    body.phone .controls {
        position: fixed;

        top: 5px;
        left: 5px;

        z-index: 20;

        width: auto;

        margin: 0;
    }


    body.phone .controls button {
        padding: 5px 8px;

        font-size: 10px;
    }


    body.phone .speed-control {
        padding: 3px 6px;

        font-size: 10px;
    }


    body.phone #speedSlider {
        width: 80px;
    }


    /*
        Счёт сверху.
    */

    body.phone .info {
        position: fixed;

        top: 5px;
        left: 50%;

        transform: translateX(-50%);

        z-index: 20;

        width: 40%;

        margin: 0;

        font-size: 13px;
    }


    /*
        Поле занимает левую часть экрана,
        оставляя место для D-pad.
    */

    body.phone .canvas-wrapper {
        position: fixed;

        top: 0;
        left: 0;

        width: calc(100vw - 140px);
        height: 100vh;

        display: flex;

        justify-content: center;
        align-items: center;
    }


    body.phone canvas {
        width: auto;
        height: auto;

        max-width: calc(100vw - 150px);
        max-height: 96vh;

        aspect-ratio: 4 / 3;
    }


    /*
        D-pad справа.
    */

    body.phone .phone-controls {
        display: block;

        top: 50%;
        right: 8px;

        left: auto;

        bottom: auto;

        transform: translateY(-50%);
    }


    body.phone #message {
        position: fixed;

        left: 50%;
        bottom: 3px;

        transform: translateX(-50%);

        z-index: 20;

        height: 22px;

        font-size: 15px;
    }
}


/* ============================================================
   VERY SMALL PHONES
   ============================================================ */

@media
(max-width: 400px)
and (orientation: portrait) {

    body.phone .controls button {
        padding: 4px 6px;

        font-size: 10px;
    }

    body.phone .speed-control {
        font-size: 10px;
    }

    body.phone #speedSlider {
        width: 70px;
    }

    body.phone .info {
        font-size: 12px;
    }

    .phone-btn {
        width: 58px;
        height: 58px;
    }

    .dpad {
        grid-template-columns:
            58px 58px 58px;

        grid-template-rows:
            58px 58px 58px;
    }
}

</style>
</head>


<body>

<div class="game">

    <h1>SNAKE DUEL</h1>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div class="controls">

        <button onclick="setMode('coop')">
            2 ИГРОКА
        </button>

        <button onclick="setMode('bot')">
            ПРОТИВ БОТА
        </button>

        <button onclick="restart()">
            RESTART
        </button>


        <div class="speed-control">

            <span>Скорость:</span>

            <input
                id="speedSlider"
                type="range"
                min="1"
                max="10"
                value="5"
            >

            <span id="speedValue">
                5
            </span>

        </div>

    </div>


    <!-- =====================================================
         SCORE
         ===================================================== -->

    <div class="info">

        <span class="p1">

            🟢 Игрок 1:

            <span id="score1">
                0
            </span>

        </span>


        <span class="food">

            Еда:

            <span id="foodCount">
                0
            </span>

        </span>


        <span class="p2">

            🔵

            <span id="player2Name">
                Игрок 2
            </span>:

            <span id="score2">
                0
            </span>

        </span>

    </div>


    <!-- =====================================================
         GAME FIELD
         ===================================================== -->

    <div class="canvas-wrapper">

        <canvas
            id="game"
            width="800"
            height="600">
        </canvas>

    </div>


    <div id="message"></div>


    <div class="help">

        Игрок 1: WASD<br>

        Игрок 2: стрелки<br>

        R — перезапуск игры.

    </div>

</div>


<!-- =========================================================
     PHONE D-PAD
     ========================================================= -->

<div
    id="phoneControls"
    class="phone-controls">

    <div class="dpad">

        <button
            class="phone-btn dpad-up"
            data-direction="up">
            ▲
        </button>


        <button
            class="phone-btn dpad-left"
            data-direction="left">
            ◀
        </button>


        <button
            class="phone-btn dpad-down"
            data-direction="down">
            ▼
        </button>


        <button
            class="phone-btn dpad-right"
            data-direction="right">
            ▶
        </button>

    </div>

</div>


<script>

/* ============================================================
   CONFIG
   ============================================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


const CELL = 20;

const COLS =
    canvas.width / CELL;

const ROWS =
    canvas.height / CELL;


/* ============================================================
   DEVICE DETECTION
   ============================================================ */

/*
    Определяем именно touch-устройство.

    navigator.maxTouchPoints позволяет распознавать
    современные Android/iOS устройства.

    User-Agent используется как дополнительная страховка.
*/

function isTouchDevice() {

    const hasTouch =
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0;


    const mobileUA =
        /Android|iPhone|iPad|iPod|Mobile/i
            .test(navigator.userAgent);


    return hasTouch || mobileUA;
}


const isPhone =
    isTouchDevice();


/*
    Автоматически включаем телефонный интерфейс.

    Никакой кнопки "Телефон" больше нет.
*/

if (isPhone) {

    document.body.classList.add("phone");

}


/* ============================================================
   GAME STATE
   ============================================================ */

let mode =
    isPhone
        ? "phone"
        : "coop";


let gameOver = false;

let snake1;

let snake2;

let food;

let score1 = 0;

let score2 = 0;

let foodCount = 0;

let lastTick = 0;


/*
    На телефоне второй игрок автоматически становится ботом.
*/

if (isPhone) {

    document.getElementById(
        "player2Name"
    ).textContent = "Бот";

}


/* ============================================================
   SPEED
   ============================================================ */

let speed = 5;


const speedSlider =
    document.getElementById(
        "speedSlider"
    );


speedSlider.addEventListener(
    "input",
    () => {

        speed =
            Number(
                speedSlider.value
            );


        document.getElementById(
            "speedValue"
        ).textContent =
            speed;

    }
);


function getTickInterval() {

    /*
        1  = 165 ms
        5  = 105 ms
        10 = 30 ms
    */

    return 180 - speed * 15;
}


/* ============================================================
   DIRECTIONS
   ============================================================ */

const DIR = {

    UP: {
        x: 0,
        y: -1
    },

    DOWN: {
        x: 0,
        y: 1
    },

    LEFT: {
        x: -1,
        y: 0
    },

    RIGHT: {
        x: 1,
        y: 0
    }

};


function opposite(a, b) {

    return (

        a.x === -b.x &&

        a.y === -b.y

    );
}


/* ============================================================
   CREATE SNAKE
   ============================================================ */

function createSnake(
    x,
    y,
    direction,
    color
) {

    return {

        body: [

            {
                x: x,
                y: y
            },

            {
                x:
                    x - direction.x,

                y:
                    y - direction.y
            },

            {
                x:
                    x - direction.x * 2,

                y:
                    y - direction.y * 2
            },

            {
                x:
                    x - direction.x * 3,

                y:
                    y - direction.y * 3
            }

        ],

        direction: {
            ...direction
        },

        nextDirection: {
            ...direction
        },

        color: color,

        alive: true,

        score: 0
    };
}


/* ============================================================
   RESTART
   ============================================================ */

function restart() {

    gameOver = false;

    score1 = 0;

    score2 = 0;

    foodCount = 0;


    snake1 = createSnake(

        10,

        Math.floor(
            ROWS / 2
        ),

        DIR.RIGHT,

        "#42e878"

    );


    snake2 = createSnake(

        COLS - 11,

        Math.floor(
            ROWS / 2
        ),

        DIR.LEFT,

        "#4da6ff"

    );


    spawnFood();


    document.getElementById(
        "message"
    ).textContent = "";


    updateScore();


    lastTick =
        performance.now();
}


/* ============================================================
   GAME MODE
   ============================================================ */

function setMode(newMode) {

    /*
        На телефоне режим всегда phone.

        На ПК доступны:
        - coop
        - bot
    */

    if (isPhone) {

        mode = "phone";

        document.getElementById(
            "player2Name"
        ).textContent = "Бот";

        restart();

        return;
    }


    mode = newMode;


    document.getElementById(
        "player2Name"
    ).textContent =

        mode === "bot"
            ? "Бот"
            : "Игрок 2";


    restart();
}


/* ============================================================
   KEYBOARD
   ============================================================ */

document.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();


        /*
            На телефоне клавиатурное управление
            не используется.
        */

        if (isPhone) {

            if (key === "r") {
                restart();
            }

            return;
        }


        /* PLAYER 1 */

        if (key === "w") {

            changeDirection(
                snake1,
                DIR.UP
            );
        }


        if (key === "s") {

            changeDirection(
                snake1,
                DIR.DOWN
            );
        }


        if (key === "a") {

            changeDirection(
                snake1,
                DIR.LEFT
            );
        }


        if (key === "d") {

            changeDirection(
                snake1,
                DIR.RIGHT
            );
        }
		
		if (key === "ц") {

            changeDirection(
                snake1,
                DIR.UP
            );
        }


        if (key === "ы") {

            changeDirection(
                snake1,
                DIR.DOWN
            );
        }


        if (key === "ф") {

            changeDirection(
                snake1,
                DIR.LEFT
            );
        }


        if (key === "в") {

            changeDirection(
                snake1,
                DIR.RIGHT
            );
        }


        /* PLAYER 2 */

        if (mode === "coop") {

            if (
                event.key === "ArrowUp"
            ) {

                changeDirection(
                    snake2,
                    DIR.UP
                );
            }


            if (
                event.key === "ArrowDown"
            ) {

                changeDirection(
                    snake2,
                    DIR.DOWN
                );
            }


            if (
                event.key === "ArrowLeft"
            ) {

                changeDirection(
                    snake2,
                    DIR.LEFT
                );
            }


            if (
                event.key === "ArrowRight"
            ) {

                changeDirection(
                    snake2,
                    DIR.RIGHT
                );
            }
        }


        if (key === "r") {

            restart();
        }

    }
);


/* ============================================================
   CHANGE DIRECTION
   ============================================================ */

function changeDirection(
    snake,
    direction
) {

    if (!snake.alive) {
        return;
    }


    /*
        Запрещаем мгновенный разворот
        на 180 градусов.
    */

    if (
        !opposite(
            snake.direction,
            direction
        )
    ) {

        snake.nextDirection = {
            ...direction
        };
    }
}


/* ============================================================
   PHONE CONTROLS
   ============================================================ */

document
    .querySelectorAll(".phone-btn")
    .forEach(button => {


        /*
            pointerdown работает и для touch,
            и для мыши.

            Это надёжнее, чем отдельно
            touchstart/click.
        */

        button.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();


                if (
                    !isPhone ||
                    mode !== "phone"
                ) {
                    return;
                }


                const direction =
                    button.dataset.direction;


                if (
                    direction === "up"
                ) {

                    changeDirection(
                        snake1,
                        DIR.UP
                    );
                }


                if (
                    direction === "down"
                ) {

                    changeDirection(
                        snake1,
                        DIR.DOWN
                    );
                }


                if (
                    direction === "left"
                ) {

                    changeDirection(
                        snake1,
                        DIR.LEFT
                    );
                }


                if (
                    direction === "right"
                ) {

                    changeDirection(
                        snake1,
                        DIR.RIGHT
                    );
                }

            }
        );

    });


/* ============================================================
   FOOD
   ============================================================ */

function spawnFood() {

    let position;


    do {

        position = {

            x:
                Math.floor(
                    Math.random() * COLS
                ),

            y:
                Math.floor(
                    Math.random() * ROWS
                )

        };

    } while (

        isOccupied(
            position,
            snake1
        )

        ||

        isOccupied(
            position,
            snake2
        )

    );


    food = position;
}


function isOccupied(
    position,
    snake
) {

    if (!snake) {
        return false;
    }


    return snake.body.some(
        part =>

            part.x === position.x &&

            part.y === position.y

    );
}


/* ============================================================
   BOT AI
   ============================================================ */

function botThink() {

    if (!snake2.alive) {
        return;
    }


    const head =
        snake2.body[0];


    const possibleDirections = [

        DIR.UP,

        DIR.DOWN,

        DIR.LEFT,

        DIR.RIGHT

    ];


    const directions =
        possibleDirections.filter(
            direction =>

                !opposite(
                    snake2.direction,
                    direction
                )
        );


    let bestDirection =
        snake2.direction;

    let bestScore =
        -Infinity;


    for (
        const direction of directions
    ) {

        const next = {

            x:
                head.x +
                direction.x,

            y:
                head.y +
                direction.y

        };


        /* Wall */

        if (

            next.x < 0 ||

            next.x >= COLS ||

            next.y < 0 ||

            next.y >= ROWS

        ) {

            continue;
        }


        /* Collision */

        if (
            dangerous(next)
        ) {

            continue;
        }


        /* Food */

        const distanceToFood =

            Math.abs(
                next.x -
                food.x
            )

            +

            Math.abs(
                next.y -
                food.y
            );


        let value =
            -distanceToFood;


        /*
            Если игрок рядом,
            бот слегка стремится к нему.
        */

        const distanceToPlayer =

            Math.abs(
                next.x -
                snake1.body[0].x
            )

            +

            Math.abs(
                next.y -
                snake1.body[0].y
            );


        if (
            distanceToPlayer < 6
        ) {

            value += 2;
        }


        value +=
            Math.random() * 0.8;


        if (
            value > bestScore
        ) {

            bestScore =
                value;

            bestDirection =
                direction;
        }

    }


    snake2.nextDirection = {
        ...bestDirection
    };
}


function dangerous(position) {

    /* Own body */

    for (
        const part of snake2.body
    ) {

        if (

            part.x === position.x &&

            part.y === position.y

        ) {

            return true;
        }
    }


    /* Player body */

    for (
        const part of snake1.body
    ) {

        if (

            part.x === position.x &&

            part.y === position.y

        ) {

            return true;
        }
    }


    return false;
}


/* ============================================================
   UPDATE
   ============================================================ */

function update() {

    if (gameOver) {
        return;
    }


    /*
        На телефоне бот управляет синей змеёй.

        На ПК бот работает только в режиме bot.
    */

    if (

        mode === "bot" ||

        mode === "phone"

    ) {

        botThink();
    }


    snake1.direction = {
        ...snake1.nextDirection
    };


    snake2.direction = {
        ...snake2.nextDirection
    };


    const next1 =
        getNextHead(snake1);


    const next2 =
        getNextHead(snake2);


    /* COLLISION */

    checkCollision(
        snake1,
        next1,
        snake2,
        next2
    );


    checkCollision(
        snake2,
        next2,
        snake1,
        next1
    );


    /* MOVE */

    moveSnake(
        snake1,
        next1
    );


    moveSnake(
        snake2,
        next2
    );


    /* FOOD */

    let ate1 = false;

    let ate2 = false;


    if (

        snake1.alive &&

        next1.x === food.x &&

        next1.y === food.y

    ) {

        ate1 = true;
    }


    if (

        snake2.alive &&

        next2.x === food.x &&

        next2.y === food.y

    ) {

        ate2 = true;
    }


    /* PLAYER 1 GROW */

    if (ate1) {

        snake1.score++;

        score1++;

        foodCount++;


        snake1.body.push({

            ...snake1.body[
                snake1.body.length - 1
            ]

        });
    }


    /* PLAYER 2 GROW */

    if (ate2) {

        snake2.score++;

        score2++;

        foodCount++;


        snake2.body.push({

            ...snake2.body[
                snake2.body.length - 1
            ]

        });
    }


    if (
        ate1 ||
        ate2
    ) {

        spawnFood();
    }


    updateScore();

    checkWinner();
}


/* ============================================================
   MOVEMENT
   ============================================================ */

function getNextHead(snake) {

    const head =
        snake.body[0];


    return {

        x:
            head.x +
            snake.direction.x,

        y:
            head.y +
            snake.direction.y

    };
}


function moveSnake(
    snake,
    nextHead
) {

    if (!snake.alive) {
        return;
    }


    snake.body.unshift(
        nextHead
    );


    snake.body.pop();
}


/* ============================================================
   COLLISION
   ============================================================ */

function checkCollision(
    snake,
    next,
    enemy,
    enemyNext
) {

    if (!snake.alive) {
        return true;
    }


    /* WALL */

    if (

        next.x < 0 ||

        next.x >= COLS ||

        next.y < 0 ||

        next.y >= ROWS

    ) {

        snake.alive = false;

        return true;
    }


    /* OWN BODY */

    for (
        const part of snake.body
    ) {

        if (

            part.x === next.x &&

            part.y === next.y

        ) {

            snake.alive = false;

            return true;
        }
    }


    /* ENEMY BODY */

    for (
        const part of enemy.body
    ) {

        if (

            part.x === next.x &&

            part.y === next.y

        ) {

            snake.alive = false;

            return true;
        }
    }


    /* HEAD TO HEAD */

    if (

        next.x === enemyNext.x &&

        next.y === enemyNext.y

    ) {

        if (

            snake.body.length >

            enemy.body.length

        ) {

            enemy.alive = false;

        }

        else if (

            snake.body.length <

            enemy.body.length

        ) {

            snake.alive = false;

        }

        else {

            snake.alive = false;

            enemy.alive = false;
        }


        return !snake.alive;
    }


    return false;
}


/* ============================================================
   WINNER
   ============================================================ */

function checkWinner() {

    if (

        !snake1.alive &&

        !snake2.alive

    ) {

        gameOver = true;


        document.getElementById(
            "message"
        ).textContent =
            "💥 НИЧЬЯ";


        return;
    }


    if (!snake1.alive) {

        gameOver = true;


        document.getElementById(
            "message"
        ).textContent =
            "🔵 БОТ ПОБЕДИЛ";


        return;
    }


    if (!snake2.alive) {

        gameOver = true;


        document.getElementById(
            "message"
        ).textContent =
            "🟢 ИГРОК 1 ПОБЕДИЛ";


        return;
    }
}


/* ============================================================
   SCORE
   ============================================================ */

function updateScore() {

    document.getElementById(
        "score1"
    ).textContent =
        score1;


    document.getElementById(
        "score2"
    ).textContent =
        score2;


    document.getElementById(
        "foodCount"
    ).textContent =
        foodCount;
}


/* ============================================================
   DRAW
   ============================================================ */

function draw() {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    drawGrid();

    drawFood();

    drawSnake(snake1);

    drawSnake(snake2);
}


/* ============================================================
   GRID
   ============================================================ */

function drawGrid() {

    ctx.strokeStyle =
        "#151515";

    ctx.lineWidth = 1;


    for (

        let x = 0;

        x <= canvas.width;

        x += CELL

    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();
    }


    for (

        let y = 0;

        y <= canvas.height;

        y += CELL

    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();
    }
}


/* ============================================================
   FOOD
   ============================================================ */

function drawFood() {

    const cx =
        food.x * CELL +
        CELL / 2;


    const cy =
        food.y * CELL +
        CELL / 2;


    ctx.fillStyle =
        "#ff4040";


    ctx.beginPath();


    ctx.arc(

        cx,
        cy,

        CELL * 0.32,

        0,
        Math.PI * 2

    );


    ctx.fill();
}


/* ============================================================
   SNAKE
   ============================================================ */

function drawSnake(snake) {

    for (

        let i =
            snake.body.length - 1;

        i >= 0;

        i--

    ) {

        const part =
            snake.body[i];


        const x =
            part.x * CELL;


        const y =
            part.y * CELL;


        ctx.globalAlpha =
            snake.alive
                ? 1
                : 0.25;


        ctx.fillStyle =
            snake.color;


        ctx.fillRect(

            x + 1,
            y + 1,

            CELL - 2,
            CELL - 2

        );


        /* HEAD */

        if (

            i === 0 &&

            snake.alive

        ) {

            ctx.fillStyle =
                "#fff";


            const eyeSize = 3;


            let ex1;
            let ey1;

            let ex2;
            let ey2;


            if (
                snake.direction.x !== 0
            ) {

                ex1 =
                    snake.direction.x > 0

                        ? x + CELL - 7

                        : x + 4;


                ex2 = ex1;


                ey1 =
                    y + 5;


                ey2 =
                    y + CELL - 7;

            }

            else {

                ey1 =
                    snake.direction.y > 0

                        ? y + CELL - 7

                        : y + 4;


                ey2 = ey1;


                ex1 =
                    x + 5;


                ex2 =
                    x + CELL - 8;
            }


            ctx.fillRect(

                ex1,
                ey1,

                eyeSize,
                eyeSize

            );


            ctx.fillRect(

                ex2,
                ey2,

                eyeSize,
                eyeSize

            );
        }

    }


    ctx.globalAlpha = 1;
}


/* ============================================================
   MAIN LOOP
   ============================================================ */

function loop(timestamp) {

    if (

        timestamp - lastTick >=

        getTickInterval()

    ) {

        update();

        lastTick =
            timestamp;
    }


    draw();


    requestAnimationFrame(
        loop
    );
}


/* ============================================================
   START
   ============================================================ */

restart();

requestAnimationFrame(
    loop
);

</script>
